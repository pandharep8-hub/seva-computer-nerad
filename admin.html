<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075985">
<title>Seva Computer - Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef4fb;color:#172554}
header{background:linear-gradient(120deg,#075985,#4f46e5);color:white;padding:22px 15px;text-align:center}
header h2{margin:0 0 7px}
main{max-width:1000px;margin:auto;padding:14px}
.card{background:white;border-radius:15px;padding:16px;margin:13px 0;box-shadow:0 3px 14px #0001}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}
button{background:#075985;color:white;border:0;font-weight:bold;cursor:pointer}
button.green{background:#15803d}
button.red{background:#dc2626}
button.orange{background:#ea580c}
.small{font-size:12px;color:#64748b}
.hidden{display:none}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#e0f2fe;padding:13px;border-radius:12px}
.stat b{display:block;font-size:20px;margin-top:5px}
.item{border:1px solid #dbeafe;border-radius:12px;padding:12px;margin:10px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<h2>सेवा कॉम्पुटर नेरड</h2>
<div>Admin Dashboard</div>
</header>
<main>

<section id="loginBox" class="card">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin Gmail">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login करा</button>
<p id="loginMsg"></p>
</section>

<section id="dashboard" class="hidden">

<div class="card">
<button id="logoutBtn" class="red">Logout</button>
<h3>Dashboard</h3>
<div class="stats">
<div class="stat">आजचे उत्पन्न<b id="todayIncome">₹0</b></div>
<div class="stat">आजचा खर्च<b id="todayExpense">₹0</b></div>
<div class="stat">महिन्याचे उत्पन्न<b id="monthIncome">₹0</b></div>
<div class="stat">महिन्याचा नफा<b id="monthProfit">₹0</b></div>
</div>
</div>

<div class="card">
<h3>प्रत्यक्ष ग्राहक नोंदणी</h3>
<input id="cName" placeholder="ग्राहकाचे नाव">
<input id="cMobile" maxlength="10" placeholder="मोबाईल नंबर">
<input id="cDistrict" placeholder="जिल्हा">
<input id="cTaluka" placeholder="तालुका">
<input id="cVillage" placeholder="गाव">
<input id="cService" placeholder="सेवेचे नाव">
<input id="cAmount" type="number" placeholder="रक्कम">
<label><input id="cConsent" type="checkbox" style="width:auto"> WhatsApp संदेशासाठी संमती आहे</label>
<button id="addCustomer" class="green">ग्राहक नोंदवा</button>
<p id="addMsg"></p>
</div>

<div class="card">
<h3>खर्च नोंदणी</h3>
<input id="expenseName" placeholder="खर्चाचे कारण">
<input id="expenseAmount" type="number" placeholder="खर्च रक्कम">
<input id="expenseDate" type="date">
<button id="addExpense" class="orange">खर्च सेव्ह करा</button>
<p id="expenseMsg"></p>
</div>

<div class="card">
<h3>ग्राहक यादी</h3>
<input id="search" placeholder="नाव किंवा मोबाईल शोधा">
<button id="refreshBtn">यादी Refresh करा</button>
<div id="customerList">लोड होत आहे...</div>
<button id="csvBtn">CSV रिपोर्ट डाउनलोड</button>
</div>

<div class="card">
<h3>WhatsApp संदेश</h3>
<p class="small">फक्त WhatsApp संदेशासाठी संमती दिलेल्या ग्राहकांची यादी.</p>
<textarea id="announcement" rows="4" style="width:100%;padding:12px" placeholder="नवीन योजना किंवा सेवेचा संदेश लिहा"></textarea>
<div id="waList"></div>
</div>

</section>
</main>

<script type="module">
import {auth,db} from "./firebase-config.js";

import {
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 collection,addDoc,getDocs,updateDoc,deleteDoc,doc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const ADMIN_EMAIL="pandharep8@gmail.com";

const $=id=>document.getElementById(id);
let customers=[];
let expenses=[];

$("loginBtn").onclick=async()=>{
 $("loginMsg").textContent="Login होत आहे...";
 try{
  const user=await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
  if(user.user.email!==ADMIN_EMAIL){
   await signOut(auth);
   $("loginMsg").textContent="हा Admin Gmail नाही.";
  }
 }catch(e){
  $("loginMsg").textContent="Login Error: "+e.message;
 }
};

onAuthStateChanged(auth,async user=>{
 if(user && user.email===ADMIN_EMAIL){
  $("loginBox").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  await loadData();
 }else{
  $("dashboard").classList.add("hidden");
  $("loginBox").classList.remove("hidden");
 }
});

$("logoutBtn").onclick=()=>signOut(auth);
$("refreshBtn").onclick=loadData;

async function loadData(){
 $("customerList").textContent="लोड होत आहे...";
 try{
  const [a,e]=await Promise.all([
   getDocs(collection(db,"applications")),
   getDocs(collection(db,"expenses"))
  ]);
  customers=a.docs.map(d=>({id:d.id,...d.data()}));
  expenses=e.docs.map(d=>({id:d.id,...d.data()}));
  showCustomers();
  calculate();
  showWhatsApp();
 }catch(err){
  $("customerList").textContent="डेटा लोड Error: "+err.message;
 }
}

$("addCustomer").onclick=async()=>{
 const name=$("cName").value.trim();
 const mobile=$("cMobile").value.trim();
 const district=$("cDistrict").value.trim();
 const taluka=$("cTaluka").value.trim();
 const village=$("cVillage").value.trim();
 const service=$("cService").value.trim();
 const amount=Number($("cAmount").value);

 if(!name||!mobile||!district||!taluka||!village||!service||!Number.isFinite(amount)||amount<0){
  $("addMsg").textContent="सर्व माहिती योग्य भरा.";
  return;
 }
 if(!/^[6-9][0-9]{9}$/.test(mobile)){
  $("addMsg").textContent="मोबाईल नंबर तपासा.";
  return;
 }
 try{
  await addDoc(collection(db,"applications"),{
   name,mobile,district,taluka,village,service,amount,
   status:"काम बाकी",paid:false,
   source:"प्रत्यक्ष ग्राहक",
   whatsappConsent:$("cConsent").checked,
   createdAt:serverTimestamp()
  });
  $("addMsg").textContent="ग्राहक नोंदणी यशस्वी!";
  ["cName","cMobile","cDistrict","cTaluka","cVillage","cService","cAmount"].forEach(id=>$(id).value="");
  $("cConsent").checked=false;
  await loadData();
 }catch(err){
  $("addMsg").textContent="नोंदणी Error: "+err.message;
 }
};

$("addExpense").onclick=async()=>{
 const name=$("expenseName").value.trim();
 const amount=Number($("expenseAmount").value);
 const date=$("expenseDate").value;
 if(!name||!date||!Number.isFinite(amount)||amount<=0){
  $("expenseMsg").textContent="खर्चाची माहिती भरा.";
  return;
 }
 try{
  await addDoc(collection(db,"expenses"),{
   name,amount,date,createdAt:serverTimestamp()
  });
  $("expenseMsg").textContent="खर्च सेव्ह झाला.";
  $("expenseName").value="";
  $("expenseAmount").value="";
  await loadData();
 }catch(err){
  $("expenseMsg").textContent="Error: "+err.message;
 }
};

function dateString(value){
 if(!value)return "";
 if(value.toDate)return value.toDate().toLocaleDateString("en-CA");
 return String(value).slice(0,10);
}

function showCustomers(){
 const q=$("search").value.toLowerCase();
 const list=customers.filter(c=>
  (c.name||"").toLowerCase().includes(q)||(c.mobile||"").includes(q)
 );
 $("customerList").innerHTML="";
 if(!list.length){
  $("customerList").textContent="ग्राहक नोंद उपलब्ध नाही.";
  return;
 }
 list.forEach(c=>{
  const div=document.createElement("div");
  div.className="item";
  const title=document.createElement("b");
  title.textContent=(c.name||"") ;
  const details=document.createElement("p");
  details.textContent=(c.mobile||"")+" | "+(c.service||"")+" | ₹"+(c.amount||0);
  const status=document.createElement("p");
  status.textContent=(c.status||"काम बाकी")+" | "+(c.paid?"पैसे जमा":"पैसे बाकी");
  div.append(title,details,status);

  const actions=document.createElement("div");
  actions.className="actions";
  const work=document.createElement("button");
  work.textContent="काम पूर्ण";
  work.onclick=()=>changeRecord(c.id,{status:"काम पूर्ण"});
  const paid=document.createElement("button");
  paid.className="green";
  paid.textContent="पैसे जमा";
  paid.onclick=()=>changeRecord(c.id,{paid:true,paidAt:serverTimestamp()});
  const wa=document.createElement("button");
  wa.className="orange";
  wa.textContent="WhatsApp";
  wa.onclick=()=>window.open("https://wa.me/91"+c.mobile,"_blank");
  const del=document.createElement("button");
  del.className="red";
  del.textContent="Delete";
  del.onclick=async()=>{
   if(confirm("हा ग्राहक कायमचा Delete करायचा आहे?")){
    try{await deleteDoc(doc(db,"applications",c.id));await loadData();}
    catch(e){alert("Delete Error: "+e.message);}
   }
  };
  actions.append(work,paid,wa,del);
  div.append(actions);
  $("customerList").append(div);
 });
}

async function changeRecord(id,data){
 try{
  await updateDoc(doc(db,"applications",id),data);
  await loadData();
 }catch(e){alert("Update Error: "+e.message);}
}

$("search").oninput=showCustomers;

function calculate(){
 const now=new Date();
 const today=now.toLocaleDateString("en-CA");
 const month=today.slice(0,7);
 const incomeToday=customers.filter(c=>c.paid&&dateString(c.paidAt)===today).reduce((s,c)=>s+Number(c.amount||0),0);
 const incomeMonth=customers.filter(c=>c.paid&&dateString(c.paidAt).startsWith(month)).reduce((s,c)=>s+Number(c.amount||0),0);
 const expenseToday=expenses.filter(e=>e.date===today).reduce((s,e)=>s+Number(e.amount||0),0);
 const expenseMonth=expenses.filter(e=>String(e.date||"").startsWith(month)).reduce((s,e)=>s+Number(e.amount||0),0);
 $("todayIncome").textContent="₹"+incomeToday;
 $("todayExpense").textContent="₹"+expenseToday;
 $("monthIncome").textContent="₹"+incomeMonth;
 $("monthProfit").textContent="₹"+(incomeMonth-expenseMonth);
}

function showWhatsApp(){
 $("waList").innerHTML="";
 customers.filter(c=>c.whatsappConsent===true).forEach(c=>{
  const b=document.createElement("button");
  b.className="green";
  b.textContent="संदेश पाठवा: "+(c.name||"ग्राहक");
  b.onclick=()=>{
   const msg=$("announcement").value.trim();
   if(!msg){alert("आधी संदेश लिहा.");return;}
   window.open("https://wa.me/91"+c.mobile+"?text="+encodeURIComponent(msg),"_blank");
  };
  $("waList").append(b);
 });
}

$("csvBtn").onclick=()=>{
 const rows=[["ग्राहक नाव","मोबाईल","सेवा","रक्कम","दिनांक","काम स्थिती","पेमेंट"]];
 customers.forEach(c=>rows.push([
  c.name,c.mobile,c.service,c.amount,dateString(c.createdAt),c.status,c.paid?"जमा":"बाकी"
 ]));
 const csv="\uFEFF"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
 a.download="Seva-Customer-Report.csv";
 a.click();
 URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
