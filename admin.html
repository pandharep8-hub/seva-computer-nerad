<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seva Computer Nerad - Admin</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f4f9;
  margin: 0;
  padding: 15px;
}
.container {
  max-width: 1100px;
  margin: auto;
}
h2 { text-align: center; color: #123b70; }
.box {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin: 12px 0;
  box-shadow: 0 2px 8px #ddd;
}
input, button {
  padding: 11px;
  margin: 5px 0;
  border-radius: 6px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}
input { width: 100%; }
button {
  background: #0759a5;
  color: white;
  border: none;
  cursor: pointer;
}
button:disabled { opacity: .6; }
.green { background: #16833b; }
.red { background: #c62828; }
.whatsapp { background: #128c50; }
.stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.stat {
  flex: 1;
  min-width: 130px;
  background: #e4f1ff;
  padding: 15px;
  border-radius: 8px;
  text-align: center;
}
.stat strong {
  display: block;
  font-size: 23px;
  margin-top: 8px;
}
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  min-width: 850px;
}
th, td {
  padding: 10px;
  border: 1px solid #ddd;
  text-align: left;
}
th { background: #123b70; color: white; }
.done { color: green; font-weight: bold; }
.pending { color: #b56b00; font-weight: bold; }
#dashboard { display: none; }
</style>
</head>

<body>
<div class="container">

<h2>सेवा कॉम्पुटर नेरड</h2>
<h3 style="text-align:center">Admin Dashboard</h3>

<div class="box" id="loginBox">
  <h3>Admin Login</h3>
  <input id="email" type="email" placeholder="Admin Gmail">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p id="loginMessage"></p>
</div>

<div id="dashboard">

  <div class="box">
    <button class="red" onclick="logout()">Logout</button>
    <button class="green" onclick="loadCustomers()">Refresh</button>
    <button onclick="downloadCSV()">Download CSV</button>
  </div>

  <div class="stats">
    <div class="stat">
      एकूण ग्राहक
      <strong id="totalCustomers">0</strong>
    </div>
    <div class="stat">
      एकूण रक्कम
      <strong id="totalAmount">₹0</strong>
    </div>
    <div class="stat">
      काम पूर्ण
      <strong id="completedCount">0</strong>
    </div>
  </div>

  <div class="box">
    <input id="search" placeholder="ग्राहक नाव किंवा मोबाईल शोधा"
      oninput="showCustomers()">
  </div>

  <div class="box table-wrap">
    <table>
      <thead>
        <tr>
          <th>क्र.</th>
          <th>ग्राहक नाव</th>
          <th>मोबाईल</th>
          <th>सेवा</th>
          <th>रक्कम</th>
          <th>दिनांक</th>
          <th>स्थिती</th>
          <th>काम पूर्ण</th>
          <th>WhatsApp</th>
        </tr>
      </thead>
      <tbody id="customerTable"></tbody>
    </table>
  </div>

</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

// 1. तुमच्या जुन्या index.html मधील Firebase Config इथे टाका
const firebaseConfig = {
  apiKey: "AIzaSyBxmhE4xEyQ5IWtOn2j812eIrIPrHnPIIw",
  authDomain: "seva-computer-nerad-48174.firebaseapp.com",
  projectId: "seva-computer-nerad-48174",
  storageBucket: "seva-computer-nerad-48174.firebasestorage.app",
  messagingSenderId: "967389505991",
  appId: "1:967389505991:web:bad6e7f60398867e2b51e2"
};


// 2. तुमचा Admin Gmail इथे टाका
const ADMIN_EMAIL = "pandharep8@gmail.com";

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let customers = [];

// Login
async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    await auth.signInWithEmailAndPassword(email, password);
    document.getElementById("loginMessage").innerText = "";
  } catch (error) {
    document.getElementById("loginMessage").innerText =
      "Login Error: " + error.message;
  }
}

// Login तपासणी
auth.onAuthStateChanged(async user => {
  if (user && user.email === ADMIN_EMAIL) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    await loadCustomers();
  } else {
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("loginBox").style.display = "block";

    if (user) {
      await auth.signOut();
      document.getElementById("loginMessage").innerText =
        "Admin परवानगी नाही.";
    }
  }
});

// Logout
async function logout() {
  await auth.signOut();
}

// ग्राहक माहिती आणा
async function loadCustomers() {
  const table = document.getElementById("customerTable");
  table.innerHTML = "<tr><td colspan='9'>लोड होत आहे...</td></tr>";

  try {
    const snapshot = await db.collection("customers").get();

    customers = snapshot.docs.map(doc => ({
      id: doc.id,
      ...doc.data()
    }));

    customers.sort((a, b) => {
      const ta = a.createdAt?.toMillis
        ? a.createdAt.toMillis() : 0;
      const tb = b.createdAt?.toMillis
        ? b.createdAt.toMillis() : 0;
      return tb - ta;
    });

    showCustomers();

  } catch (error) {
    table.innerHTML =
      "<tr><td colspan='9'>Error: " + escapeHTML(error.message) +
      "</td></tr>";
  }
}

// सुरक्षित मजकूर
function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

// ग्राहक दाखवा
function showCustomers() {
  const search = document.getElementById("search")
    .value.toLowerCase().trim();

  const filtered = customers.filter(c =>
    String(c.name || "").toLowerCase().includes(search) ||
    String(c.phone || "").includes(search)
  );

  let total = 0;
  let completed = 0;

  customers.forEach(c => {
    total += Number(c.price) || 0;
    if (c.completed === true) completed++;
  });

  document.getElementById("totalCustomers").innerText =
    customers.length;

  document.getElementById("totalAmount").innerText =
    "₹" + total;

  document.getElementById("completedCount").innerText =
    completed;

  const tbody = document.getElementById("customerTable");
  tbody.innerHTML = "";

  if (filtered.length === 0) {
    tbody.innerHTML =
      "<tr><td colspan='9'>ग्राहक सापडला नाही.</td></tr>";
    return;
  }

  filtered.forEach((c, index) => {
    const date = c.createdAt?.toDate
      ? c.createdAt.toDate().toLocaleDateString("en-IN")
      : "-";

    const isDone = c.completed === true;

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${index + 1}</td>
      <td>${escapeHTML(c.name)}</td>
      <td>${escapeHTML(c.phone)}</td>
      <td>${escapeHTML(c.service)}</td>
      <td>₹${Number(c.price) || 0}</td>
      <td>${date}</td>
      <td class="${isDone ? "done" : "pending"}">
        ${isDone ? "काम पूर्ण" : "काम बाकी"}
      </td>
      <td>
        <button class="${isDone ? "green" : ""}"
          ${isDone ? "disabled" : ""}
          onclick="markComplete('${c.id}')">
          ${isDone ? "पूर्ण झाले" : "काम पूर्ण झाले"}
        </button>
      </td>
      <td>
        <button class="whatsapp"
          onclick="sendWhatsApp('${c.id}')">
          WhatsApp
        </button>
      </td>
    `;

    tbody.appendChild(tr);
  });
}

// काम पूर्ण स्थिती सेव्ह करा
async function markComplete(id) {
  const customer = customers.find(c => c.id === id);
  if (!customer) return;

  if (!confirm("या ग्राहकाचे काम पूर्ण झाले आहे का?")) return;

  try {
    await db.collection("customers").doc(id).update({
      completed: true,
      completedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    customer.completed = true;
    showCustomers();

    // काम पूर्ण केल्यानंतर WhatsApp उघडा
    sendWhatsApp(id);

  } catch (error) {
    alert("स्थिती सेव्ह झाली नाही: " + error.message);
  }
}

// WhatsApp मेसेज
function sendWhatsApp(id) {
  const c = customers.find(x => x.id === id);
  if (!c) return;

  let phone = String(c.phone || "").replace(/\D/g, "");

  if (phone.length === 10) {
    phone = "91" + phone;
  }

  if (phone.length !== 12 || !phone.startsWith("91")) {
    alert("ग्राहकाचा मोबाईल नंबर योग्य नाही.");
    return;
  }

  const message =
    "नमस्कार " + (c.name || "") + "!\n\n" +
    "आपले " + (c.service || "सेवेचे") +
    " हे काम यशस्वीरित्या पूर्ण झाले आहे.\n\n" +
    "सेवा कॉम्पुटर नेरड\nधन्यवाद!";

  const url =
    "https://wa.me/" + phone + "?text=" +
    encodeURIComponent(message);

  window.open(url, "_blank");
}

// CSV Download
function downloadCSV() {
  if (!customers.length) {
    alert("ग्राहकांची माहिती उपलब्ध नाही.");
    return;
  }

  const rows = [
    ["ग्राहक नाव", "मोबाईल", "सेवा", "रक्कम", "दिनांक", "स्थिती"]
  ];

  customers.forEach(c => {
    const date = c.createdAt?.toDate
      ? c.createdAt.toDate().toLocaleDateString("en-IN")
      : "";

    rows.push([
      c.name || "",
      c.phone || "",
      c.service || "",
      c.price || 0,
      date,
      c.completed ? "काम पूर्ण" : "काम बाकी"
    ]);
  });

  const csv = "\uFEFF" + rows.map(row =>
    row.map(value =>
      '"' + String(value).replace(/"/g, '""') + '"'
    ).join(",")
  ).join("\n");

  const blob = new Blob([csv], {
    type: "text/csv;charset=utf-8;"
  });

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "Seva-Computer-Customers.csv";
  link.click();
  URL.revokeObjectURL(link.href);
}

</script>
</body>
</html>
