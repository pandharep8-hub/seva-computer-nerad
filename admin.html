<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seva Computer Admin</title>
<style>
body{font-family:Arial;background:#f2f5f9;padding:20px}
.box{max-width:420px;margin:40px auto;background:white;padding:22px;border-radius:12px}
input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
button{background:#0759b5;color:white;border:0;border-radius:6px}
#msg{color:#b00020}
</style>
</head>
<body>
<div class="box">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<button id="resetBtn">Forgot Password</button>
<p id="msg"></p>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth, signInWithEmailAndPassword,
 sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyBxmhE4xEyQ5IWtOn2j812eIrIPrHnPIIw",
  authDomain: "seva-computer-nerad-48174.firebaseapp.com",
  projectId: "seva-computer-nerad-48174",
  storageBucket: "seva-computer-nerad-48174.firebasestorage.app",
  messagingSenderId: "967389505991",
  appId: "1:967389505991:web:bad6e7f60398867e2b51e2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const msg = document.getElementById("msg");

document.getElementById("loginBtn").onclick = async () => {
 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;

 try {
   await signInWithEmailAndPassword(auth,email,password);
   msg.textContent = "Login यशस्वी!";
   window.location.href = "admin.html";
 } catch(error) {
   msg.textContent = "Login अयशस्वी: " + error.message;
 }
};

document.getElementById("resetBtn").onclick = async () => {
 const email = document.getElementById("email").value.trim();

 if(!email){
   msg.textContent = "आधी Admin Email टाका.";
   return;
 }

 try {
   await sendPasswordResetEmail(auth,email);
   msg.textContent = "पासवर्ड रीसेट लिंक ईमेलवर पाठवली आहे.";
 } catch(error) {
   msg.textContent = "Error: " + error.message;
 }
};
</script>
</body>
</html>
