<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075985">
<title>ग्राहक नोंदणी - Seva Computer</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eff6ff;color:#123}
header{background:linear-gradient(135deg,#075985,#0e7490);color:white;text-align:center;padding:20px}
header h2{margin:0}
.container{max-width:600px;margin:18px auto;padding:12px}
.panel{background:white;padding:18px;border-radius:17px;box-shadow:0 4px 15px #00000012;margin-bottom:15px}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#075985;color:white;font-size:17px;margin-top:15px}
.service{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f1f5f9;margin:8px 0;padding:12px;border-radius:10px}
.service label{margin:0;font-weight:normal}
.service input{width:20px;height:20px}
.price{font-weight:bold;color:#075985;white-space:nowrap}
.note{background:#eff6ff;padding:12px;border-radius:10px;font-size:14px}
#qr{width:180px;max-width:100%;display:block;margin:12px auto}
.back{display:block;text-align:center;color:#075985;margin:12px}
</style>
</head>
<body>

<header>
<h2>सेवा कॉम्पुटर नेरड</h2>
<p id="pageTitle">ग्राहक सेवा नोंदणी</p>
</header>

<div class="container">

<div class="panel">
<h3>उपलब्ध सेवा निवडा</h3>
<div id="serviceList"></div>
</div>

<div class="panel">
<h3>ग्राहक माहिती</h3>

<form id="customerForm">
<label>ग्राहकाचे पूर्ण नाव</label>
<input id="name" required>

<label>मोबाईल नंबर</label>
<input id="mobile" type="tel" pattern="[0-9]{10}" maxlength="10" required>

<label>जिल्हा</label>
<input id="district" value="यवतमाळ" required>

<label>तालुका</label>
<input id="taluka" value="वणी" required>

<label>गाव</label>
<input id="village" value="नेरड" required>

<div class="note" id="selectedInfo">कृपया वरील यादीतून सेवा निवडा.</div>

<button type="submit" id="submitBtn">नोंदणी करा</button>
</form>
</div>

<div class="panel">
<h3 style="text-align:center">💳 QR कोडद्वारे पेमेंट</h3>
<img id="qr" src="./qr.jpeg" alt="Payment QR Code">
<p style="text-align:center">पेमेंट करण्यासाठी QR कोड स्कॅन करा.</p>
</div>

<a class="back" href="./index.html">← मुख्य पेजवर परत जा</a>
</div>

<script type="module">
import { db } from "./firebase-config.js";
import {
 addDoc, collection, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const services = [
 // विद्यार्थी
 {name:"शिष्यवृत्ती अर्ज",price:100,category:"student"},
 {name:"विद्यार्थी योजना अर्ज",price:100,category:"student"},
 {name:"सरकारी / निमसरकारी नोकरी अर्ज",price:100,category:"student"},

 // शेतकरी
 {name:"PM किसान नोंदणी",price:250,category:"farmer"},
 {name:"Maha DBT शेतकरी योजना",price:70,category:"farmer"},
 {name:"Farmer ID",price:50,category:"farmer"},
 {name:"पीक पाहणी",price:100,category:"farmer"},
 {name:"खरीप पीक विमा",price:100,category:"farmer"},
 {name:"रब्बी पीक विमा",price:100,category:"farmer"},
 {name:"महिला शेतकरी प्रमाणपत्र",price:50,category:"farmer"},
 {name:"महिला शेतकरी प्रमाणपत्र + लॅमिनेशन",price:80,category:"farmer"},
 {name:"7/12 उतारा",price:50,category:"farmer"},
 {name:"8A उतारा",price:50,category:"farmer"},

 // महिला
 {name:"लाडकी बहीण योजना अर्ज",price:50,category:"women"},
 {name:"महिला शेतकरी प्रमाणपत्र",price:50,category:"women"},
 {name:"महिला शेतकरी प्रमाणपत्र + लॅमिनेशन",price:80,category:"women"},

 // कार्ड सेवा
 {name:"Maha ID",price:70,category:"cards"},
 {name:"ABHA कार्ड",price:50,category:"cards"},
 {name:"आयुष्मान कार्ड",price:50,category:"cards"},
 {name:"आयुष्मान कार्ड दुरुस्ती",price:50,category:"cards"},
 {name:"मतदान कार्ड",price:100,category:"cards"},
 {name:"e-Shram कार्ड",price:100,category:"cards"},
 {name:"PAN कार्ड",price:250,category:"cards"},
 {name:"PAN कार्ड दुरुस्ती / हरवलेले",price:300,category:"cards"},

 // झेरॉक्स / प्रिंट
 {name:"झेरॉक्स ब्लॅक अँड व्हाइट",price:5,category:"print"},
 {name:"झेरॉक्स कलर",price:10,category:"print"},
 {name:"प्रिंट",price:10,category:"print"},
 {name:"कलर प्रिंट",price:20,category:"print"},
 {name:"A4 लॅमिनेशन",price:30,category:"print"},
 {name:"ID कार्ड लॅमिनेशन",price:10,category:"print"},
 {name:"पासपोर्ट फोटो 12 प्रती",price:70,category:"print"}
];

const category = new URLSearchParams(location.search).get("category");

const categoryNames = {
 student:"विद्यार्थी / विद्यार्थिनी सेवा",
 farmer:"शेतकरी योजना व सेवा",
 women:"महिला योजना",
 cards:"कार्ड सेवा",
 print:"झेरॉक्स / लॅमिनेशन / प्रिंट"
};

const allowedServices = services.filter(s => s.category === category);
const serviceList = document.getElementById("serviceList");
const selectedInfo = document.getElementById("selectedInfo");

document.getElementById("pageTitle").textContent =
 categoryNames[category] || "सेवा निवडा";

if (!categoryNames[category]) {
 serviceList.innerHTML = "<p>विभाग सापडला नाही. मुख्य पेजवर परत जा.</p>";
 document.getElementById("submitBtn").disabled = true;
} else {
 allowedServices.forEach((service,index) => {
  const div = document.createElement("div");
  div.className = "service";
  const label = document.createElement("label");
  const checkbox = document.createElement("input");
  checkbox.type = "radio";
  checkbox.name = "service";
  checkbox.value = index;
  checkbox.addEventListener("change", updateSelected);
  label.append(checkbox, document.createTextNode(" " + service.name));
  const price = document.createElement("span");
  price.className = "price";
  price.textContent = "₹" + service.price;
  div.append(label,price);
  serviceList.appendChild(div);
 });
}

let selectedService = null;

function updateSelected() {
 const selected = document.querySelector('input[name="service"]:checked');
 selectedService = selected ? allowedServices[Number(selected.value)] : null;
 selectedInfo.textContent = selectedService
  ? "निवडलेली सेवा: " + selectedService.name + " | शुल्क: ₹" + selectedService.price
  : "कृपया सेवा निवडा.";
}

document.getElementById("customerForm").addEventListener("submit", async (e) => {
 e.preventDefault();

 if (!selectedService) {
  alert("कृपया सेवा निवडा.");
  return;
 }

 const name = document.getElementById("name").value.trim();
 const mobile = document.getElementById("mobile").value.trim();
 const district = document.getElementById("district").value.trim();
 const taluka = document.getElementById("taluka").value.trim();
 const village = document.getElementById("village").value.trim();

 if (!/^[0-9]{10}$/.test(mobile)) {
  alert("10 अंकी मोबाईल नंबर टाका.");
  return;
 }

 const btn = document.getElementById("submitBtn");
 btn.disabled = true;
 btn.textContent = "नोंदणी होत आहे...";

 try {
  await addDoc(collection(db,"applications"),{
   name,
   mobile,
   district,
   taluka,
   village,
   service:selectedService.name,
   amount:selectedService.price,
   status:"काम बाकी",
   paid:false,
   whatsappConsent:true,
   source:"ग्राहक पेज",
   createdAt:serverTimestamp()
  });

  alert("ग्राहक नोंदणी यशस्वी झाली!");
  document.getElementById("customerForm").reset();
  selectedService = null;
  selectedInfo.textContent = "कृपया वरील यादीतून सेवा निवडा.";
 } catch(error) {
  console.error(error);
  alert("नोंदणी झाली नाही. इंटरनेट आणि Firebase सेटिंग तपासा.");
 } finally {
  btn.disabled = false;
  btn.textContent = "नोंदणी करा";
 }
});
</script>
</body>
</html>
