<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seva Computer & Xerox, Lamination Services</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eef3f9;color:#17345b}
header,footer{background:#123c70;color:white;text-align:center;padding:18px}
main{max-width:850px;margin:auto;padding:12px}
.card{background:white;padding:16px;margin:14px 0;border-radius:12px}
.service{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #ddd}
button{background:#123c70;color:white;border:0;padding:11px;border-radius:7px}
input{width:100%;padding:12px;margin:7px 0}
#customerForm{display:none}
</style>
</head>
<body>
<header>
<h2>Seva Computer & Xerox</h2>
<p>Lamination Services - Nerad</p>
<p>घरपोच सेवा आणि तुरंत सर्विस</p>
</header>
<main>
<div class="card"><h3>सर्वसाधारण कार्ड सेवा</h3><div id="general"></div></div>
<div class="card"><h3>शेतकरी योजना</h3><div id="farmer"></div></div>
<div class="card"><h3>झेरॉक्स, प्रिंट व इतर सेवा</h3><div id="other"></div></div>

<div class="card" id="customerForm">
<h3>ग्राहक नोंदणी</h3>
<p id="selected"></p>
<input id="name" placeholder="ग्राहकाचे पूर्ण नाव">
<input id="phone" placeholder="मोबाईल नंबर" maxlength="10">
<button id="save">माहिती सेव्ह करा</button>
<p id="msg"></p>
</div>

<div class="card">
<h3>संपर्क</h3>
<p>Seva Computer Nerad</p>
<p>मोबाईल: 9623557142</p>
<a href="https://wa.me/919623557142"><button>WhatsApp संपर्क</button></a>
</div>
<div class="card">
<button onclick="location.href='payment.html'">Payment QR</button>
<button onclick="location.href='register.html'">नोंदणी</button>
<button onclick="location.href='admin.html'">Admin Login</button>
</div>
</main>
<footer>Seva Computer & Xerox, Lamination Services</footer>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,serverTimestamp} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"YOUR_API_KEY",
 authDomain:"YOUR_AUTH_DOMAIN",
 projectId:"YOUR_PROJECT_ID",
 storageBucket:"YOUR_STORAGE_BUCKET",
 messagingSenderId:"YOUR_MESSAGING_SENDER_ID",
 appId:"YOUR_APP_ID"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const services={
general:[
["आभा कार्ड",50],["आयुष्मान कार्ड",50],
["आयुष्मान कार्ड दुरुस्ती",50],["महा ID कार्ड",70],
["वोटिंग कार्ड",100],["इ श्रम कार्ड",100],
["पॅन कार्ड",250],["दुरुस्ती / हरवलेले पॅन कार्ड",300]
],
farmer:[
["महिला शेतकरी प्रमाणपत्र",50],
["महिला शेतकरी प्रमाणपत्र लॅमिनेशन सोबत",80],
["फार्मर ID",50],["सात बारा",50],["आठ अ",50],
["PM किसान रेजिस्ट्रेशन",250],
["नमो शेतकरी रेजिस्ट्रेशन",250],
["प्रोत्साहन, अनुदान eKYC",50]
],
other:[
["झेरॉक्स",5],["प्रिंट",10],["रंगीत प्रिंट",20],
["लॅमिनेशन A4",30],["लॅमिनेशन ID कार्ड",10],
["पासफोटो अर्जेंट फोटो कॉपी वरून 12",70],
["शासकीय फॉर्म (फॉर्म पेमेंट सोडून)",100],
["शासकीय नोकरी फॉर्म (पेमेंट सोडून)",100],
["महा DBT फार्मर योजना",70]
]
};

let selectedService="",selectedPrice=0,loggedIn=false;

onAuthStateChanged(auth,user=>{loggedIn=!!user});

function render(){
 Object.entries(services).forEach(([group,items])=>{
  items.forEach(([name,price])=>{
   const row=document.createElement("div");
   row.className="service";
   const label=document.createElement("span");
   label.textContent=`${name} = ₹${price}`;
   const btn=document.createElement("button");
   btn.textContent="निवडा";
   btn.onclick=()=>{
    selectedService=name;selectedPrice=price;
    document.getElementById("customerForm").style.display="block";
    document.getElementById("selected").textContent=
     `${name} - ₹${price}`;
    document.getElementById("customerForm").scrollIntoView();
   };
   row.append(label,btn);
   document.getElementById(group).appendChild(row);
  });
 });
}

document.getElementById("save").onclick=async()=>{
 const name=document.getElementById("name").value.trim();
 const phone=document.getElementById("phone").value.trim();
 const msg=document.getElementById("msg");
 if(!name||!/^[0-9]{10}$/.test(phone)||!selectedService){
  msg.textContent="योग्य नाव, मोबाईल आणि सेवा भरा.";return;
 }
 if(!auth.currentUser){
  msg.textContent="ग्राहक नोंदणीसाठी सुरक्षित सार्वजनिक नोंदणी व्यवस्था अजून जोडलेली नाही.";
  return;
 }
 try{
  await addDoc(collection(db,"customers"),{
   name,phone,service:selectedService,price:selectedPrice,
   createdAt:serverTimestamp()
  });
  msg.textContent="माहिती सेव्ह झाली.";
  document.getElementById("name").value="";
  document.getElementById("phone").value="";
 }catch(e){msg.textContent="माहिती सेव्ह झाली नाही."}
};
render();
</script>
</body>
</html>
