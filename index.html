<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth, signInAnonymously
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getFirestore, collection, addDoc, serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// येथे तुमचा आधीचा Firebase Config टाका
const firebaseConfig = {
  apiKey: "AIzaSyBxmhE4xEyQ5IWtOn2j812eIrIPrHnPIIw",
  authDomain: "seva-computer-nerad-48174.firebaseapp.com",
  projectId: "seva-computer-nerad-48174",
  storageBucket: "seva-computer-nerad-48174.firebasestorage.app",
  messagingSenderId: "967389505991",
  appId: "1:967389505991:web:bad6e7f60398867e2b51e2"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const serviceInput = document.getElementById("service");
const priceText = document.getElementById("price");
const message = document.getElementById("message");
const saveBtn = document.getElementById("saveBtn");

serviceInput.addEventListener("change", () => {
 if(!serviceInput.value){
   priceText.textContent = "₹0";
   return;
 }
 const parts = serviceInput.value.split("|");
 priceText.textContent = "₹" + parts[1];
});

saveBtn.addEventListener("click", async () => {
 const name = document.getElementById("name").value.trim();
 const phone = document.getElementById("phone").value.trim();
 const selected = serviceInput.value;

 if(!name){
   message.textContent = "कृपया ग्राहकाचे नाव भरा.";
   return;
 }

 if(!/^[0-9]{10}$/.test(phone)){
   message.textContent = "योग्य 10 अंकी मोबाईल नंबर टाका.";
   return;
 }

 if(!selected){
   message.textContent = "कृपया सेवा निवडा.";
   return;
 }

 const parts = selected.split("|");
 const service = parts[0];
 const price = Number(parts[1]);

 saveBtn.disabled = true;
 saveBtn.textContent = "सेव्ह होत आहे...";
 message.textContent = "";

 try {
   if(!auth.currentUser){
     await signInAnonymously(auth);
   }

   await addDoc(collection(db,"customers"),{
     name: name,
     phone: phone,
     service: service,
     price: price,
     createdAt: serverTimestamp()
   });

   message.textContent = "ग्राहकाची माहिती यशस्वीपणे सेव्ह झाली!";
   document.getElementById("name").value = "";
   document.getElementById("phone").value = "";
   serviceInput.value = "";
   priceText.textContent = "₹0";

 } catch(error) {
   console.error(error);
   message.textContent = "माहिती सेव्ह झाली नाही: " + error.code;
 } finally {
   saveBtn.disabled = false;
   saveBtn.textContent = "माहिती सेव्ह करा";
 }
});
</script>
