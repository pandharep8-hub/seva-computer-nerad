<!DOCTYPE html>
<html lang="mr">
<link rel="manifest" href="manifest.json">
 <title>Seva Computer &amp; Xerox, Lamination Services</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seva Computer & Xerox,print, Lamination Services</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f1f4f9;margin:0;padding:15px;color:#222}
.container{max-width:650px;margin:auto}
.header{background:#123c70;color:white;text-align:center;padding:22px;border-radius:12px}
.header h2{margin:0 0 8px}
.card{background:white;padding:18px;margin-top:15px;border-radius:12px;box-shadow:0 2px 9px #ddd}
h3{color:#123c70;margin-top:0}
.service{display:flex;justify-content:space-between;align-items:center;padding:11px 5px;border-bottom:1px solid #eee;gap:8px}
.service label{flex:1}
input[type=checkbox]{width:19px;height:19px}
input[type=text],input[type=tel]{
width:100%;padding:13px;margin:7px 0 13px;
border:1px solid #bbb;border-radius:7px;font-size:16px
}
button{background:#1264b0;color:white;border:0;padding:13px;
border-radius:7px;width:100%;font-size:16px;margin-top:8px}
button:active{opacity:.8}
.total{font-size:21px;font-weight:bold;color:green;text-align:center;padding:15px}
.hidden{display:none}
.record{background:#f4f7fb;padding:12px;border-radius:8px;margin:8px 0}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<div class="container">

<div class="header">
<h2>सेवा कॉम्पुटर नेरड</h2>
<p>आपले ऑनलाइन सेवा केंद्र</p>
<b>मो. 9623557142</b>
</div>

<div class="card">
<h3>1. सेवा निवडा</h3>
<div id="services"></div>
<div class="total">एकूण बिल: ₹<span id="total">0</span></div>
</div>

<div class="card hidden" id="customerBox">
<h3>2. ग्राहकाची माहिती</h3>

<label>ग्राहकाचे नाव</label>
<input type="text" id="customerName" placeholder="ग्राहकाचे पूर्ण नाव">

<label>मोबाईल नंबर</label>
<input type="tel" id="mobile" maxlength="10" placeholder="10 अंकी मोबाईल नंबर">

<button onclick="saveCustomer()">ग्राहक माहिती सेव्ह करा</button>
<p class="small">माहिती या डिव्हाइसच्या ब्राउझरमध्ये सेव्ह होईल.</p>
</div>

<div class="card">
<h3>3. ग्राहकांची नोंद</h3>
<div id="records"></div>
<button onclick="downloadData()">ग्राहक यादी डाउनलोड करा</button>
</div>

<div class="card">
<h3>इतर पर्याय</h3>
<button onclick="location.href='register.html'">ग्राहक नोंदणी</button>
<button onclick="location.href='payment.html'">Payment QR Code</button>
<button onclick="location.href='admin.html'">Admin Page</button>
</div>

</div>

<script>
const serviceList = [
["सर्वसाधारण ID कार्ड",70],
["पीक पाहणी",100],
["Voting Card",100],
["PM Kisan Registration",250],
["Xerox Black & White",5],
["Xerox Colour",10],
["Print",10],
["अर्जंट फोटो 12 कॉपी",50],
["Maha DBT फॉर्म",70],
["लाडकी बहीण Registration",70],
["पीक विमा",100],
["eKYC",50],
["ई-श्रम कार्ड",100],
["महिला शेतकरी प्रमाणपत्र",50],
["नवीन PAN कार्ड",250],
["PAN दुरुस्ती / हरवलेले",350]
];

let selected = [];

function showServices(){
 const box=document.getElementById("services");
 box.innerHTML="";
 serviceList.forEach((s,i)=>{
 box.innerHTML+=`
 <div class="service">
 <input type="checkbox" onchange="toggleService(${i},this.checked)">
 <label>${s[0]}</label>
 <b>₹${s[1]}</b>
 </div>`;
 });
}

function toggleService(i,checked){
 if(checked){
 selected.push(i);
 }else{
 selected=selected.filter(x=>x!==i);
 }
 document.getElementById("total").innerText=
 selected.reduce((sum,x)=>sum+serviceList[x][1],0);

 document.getElementById("customerBox").classList.toggle(
 "hidden",selected.length===0
 );
}

function saveCustomer(){
 const name=document.getElementById("customerName").value.trim();
 const mobile=document.getElementById("mobile").value.trim();

 if(!name){
 alert("ग्राहकाचे नाव भरा");
 return;
 }
 if(!/^[0-9]{10}$/.test(mobile)){
 alert("योग्य 10 अंकी मोबाईल नंबर भरा");
 return;
 }
 if(selected.length===0){
 alert("सेवा निवडा");
 return;
 }

 const services=selected.map(i=>({
 name:serviceList[i][0],
 price:serviceList[i][1]
 }));

 const total=services.reduce((s,x)=>s+x.price,0);

 const customer={
 id:Date.now(),
 name:name,
 mobile:mobile,
 services:services,
 total:total,
 date:new Date().toLocaleString("mr-IN")
 };

 let records=JSON.parse(localStorage.getItem("sevaCustomers")||"[]");
 records.unshift(customer);
 localStorage.setItem("sevaCustomers",JSON.stringify(records));

 alert("ग्राहकाची माहिती सेव्ह झाली!");

 document.getElementById("customerName").value="";
 document.getElementById("mobile").value="";
 selected=[];
 document.getElementById("total").innerText="0";
 document.getElementById("customerBox").classList.add("hidden");
 showServices();
 showRecords();
}

function showRecords(){
 const records=JSON.parse(localStorage.getItem("sevaCustomers")||"[]");
 const box=document.getElementById("records");

 if(records.length===0){
 box.innerHTML="<p>अजून ग्राहकांची नोंद नाही.</p>";
 return;
 }

 box.innerHTML=records.map(c=>`
 <div class="record">
 <b>${escapeHTML(c.name)}</b><br>
 मोबाईल: ${escapeHTML(c.mobile)}<br>
 सेवा: ${c.services.map(s=>escapeHTML(s.name)).join(", ")}<br>
 एकूण: ₹${c.total}<br>
 <span class="small">${escapeHTML(c.date)}</span>
 </div>
 `).join("");
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function downloadData(){
 const records=JSON.parse(localStorage.getItem("sevaCustomers")||"[]");
 if(!records.length){
 alert("ग्राहकांची नोंद उपलब्ध नाही");
 return;
 }
 const data=records.map(c=>({
 नाव:c.name,
 मोबाईल:c.mobile,
 सेवा:c.services.map(s=>s.name).join(", "),
 रक्कम:c.total,
 तारीख:c.date
 }));
 const blob=new Blob(
 ["\uFEFF"+JSON.stringify(data,null,2)],
 {type:"application/json;charset=utf-8"}
 );
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="Seva-Computer-Customers.json";
 a.click();
 URL.revokeObjectURL(url);
}

showServices();
showRecords();
</script>
</body>
</html>
